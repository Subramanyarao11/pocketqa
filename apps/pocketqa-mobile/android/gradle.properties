org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true
android.builtInKotlin=false
android.newDsl=false

# KSP2 fails on react-native-async-storage with "unexpected jvm signature V",
# which stopped :app:testInternalLabDebugUnitTest and any app build. The failing
# task is in a third-party RN module, not our code. KSP1 processes it fine and
# Room (our only KSP consumer) is unaffected.
ksp.useKSP2=false
