apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.serialization"
apply plugin: "com.google.devtools.ksp"
apply plugin: "com.facebook.react"

// Ask node where each package is instead of hardcoding ../../../../node_modules.
// npm does not guarantee where it hoists a workspace dependency — these packages
// have resolved both to the repo root and to apps/pocketqa-mobile/node_modules
// on this machine, and the hardcoded paths broke the build when that changed.
def rnPkgDir = { String pkg ->
    new File(["node", "--print", "require.resolve('${pkg}/package.json')"]
        .execute(null, rootDir).text.trim()).getParentFile()
}

react {
    root = file("../../")
    reactNativeDir = rnPkgDir('react-native')
    codegenDir = rnPkgDir('@react-native/codegen')
    cliFile = new File(rnPkgDir('react-native'), 'cli.js')
    debuggableVariants = ["internalLabDebug", "internalLabDebugOptimized"]
    hermesCommand = new File(rnPkgDir('hermes-compiler'), 'hermesc/%OS-BIN%/hermesc').absolutePath
    autolinkLibrariesWithApp()
}


android {
    namespace "com.techphantoms.pocketqa"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.techphantoms.pocketqa"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    flavorDimensions "audience"
    productFlavors {
        publicRelease { dimension "audience" }
        internalLab   { dimension "audience" }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    // JVM unit tests (spec §35). There were none: no src/test, no test runner.
    // DeterministicRankerTest pins the Kotlin deterministic engine against the
    // scores the Python reference produces on the shared fixture corpus.
    testImplementation "junit:junit:4.13.2"

    // React Native
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // AndroidX
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"

    // Room persistence (§10 storage layer)
    implementation "androidx.room:room-runtime:$rootProject.ext.roomVersion"
    implementation "androidx.room:room-ktx:$rootProject.ext.roomVersion"
    ksp "androidx.room:room-compiler:$rootProject.ext.roomVersion"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // JSON serialization for storing schema payloads
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    // Networking (connected assist)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Provider credential vault — EncryptedSharedPreferences with an
    // AndroidKeyStore-backed MasterKey. See CredentialVault.kt.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // ML Kit GenAI (Prompt API) — on-device Gemini Nano runtime.
    // Alpha module; `compileOnly` so the app still builds when the artifact
    // isn't available in the local maven cache. Runtime detection lives in
    // InferenceRouter.ONDEVICE_GENAI_CLASSES.
    // 1.0.0-alpha1 does not exist in any repository — the app did not compile.
    // Technical Spec §7 names 1.0.0-beta2 and says to recheck before locking it.
    // compileOnly is correct: InferenceRouter reaches ML Kit reflectively so the
    // build does not depend on which alpha/beta is on the device.
    compileOnly "com.google.mlkit:genai-common:1.0.0-beta2"

    // FileProvider is bundled with core-ktx / androidx.core
}
