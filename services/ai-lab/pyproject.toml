[project]
name = "pocketqa-ai-lab"
version = "0.1.0"
description = "PocketQA AI lab: task contracts, deterministic twins, prompts and evals."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Track B adds fastapi/openai/chromadb here when the service layer lands.
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
